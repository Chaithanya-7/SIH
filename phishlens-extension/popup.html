<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishLens Shield</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Applied before the body renders, so opening the popup never flashes the
       wrong theme. -->
  <script src="theme.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-title">
        <div class="icon-shield">🛡️</div>
        <div>
          <h2>PhishLens</h2>
          <span class="sub" id="connection-state">Connecting…</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-theme" class="icon-btn" type="button"></button>
        <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
      </div>
    </header>

    <!-- What the page watcher last reported. This answers "is it looking at my
         mail", which counts of past detections cannot: those persist whether or
         not anything is watching right now. -->
    <div id="watch-state" class="notice hidden" style="margin-bottom:8px"></div>

    <!-- Connection problem / setup needed -->
    <div id="setup-notice" class="notice hidden">
      <div id="setup-message">PhishLens backend is not reachable.</div>
      <button id="btn-open-settings" class="btn-secondary full">Open settings</button>
    </div>

    <!-- Compact summary: the popup deliberately shows only headline counts. -->
    <div id="summary" class="hidden">
      <div class="counts">
        <button type="button" class="count-row high" id="filter-high" data-verdict="high"
                aria-pressed="false" title="Show only these">
          <span class="count-label">High risk</span>
          <span class="count-value" id="count-high">0</span>
        </button>
        <button type="button" class="count-row suspicious" id="filter-suspicious" data-verdict="suspicious"
                aria-pressed="false" title="Show only these">
          <span class="count-label">Suspicious</span>
          <span class="count-value" id="count-suspicious">0</span>
        </button>
        <button type="button" class="count-row safe" id="filter-safe" data-verdict="safe"
                aria-pressed="false" title="Show only these">
          <span class="count-label">Legitimate</span>
          <span class="count-value" id="count-safe">0</span>
        </button>
      </div>

      <div class="meta-row">
        <span>Quarantined <strong id="count-quarantined">0</strong></span>
        <span>Awaiting review <strong id="count-review">0</strong></span>
      </div>

      <div class="mode-note" id="mode-note"></div>

      <!-- Collapsed by default. The popup is read at a glance - the counts and
           whether the watcher is running - and the list plus the two buttons
           made it tall enough to need scrolling for information most openings
           do not want. -->
      <details id="details-drawer" class="drawer">
        <summary class="drawer-summary">
          <span id="drawer-title">Recent detections</span>
          <span class="drawer-chevron" aria-hidden="true">&#9662;</span>
        </summary>

        <div class="drawer-body">
          <ul id="recent-list" class="recent-list">
            <li class="empty">No messages analyzed yet.</li>
          </ul>

          <div class="footer">
            <button id="btn-more-info" class="btn-primary full">More info &rarr;</button>
            <button id="btn-web-console" class="link-btn">Desktop app not installed? Open web console</button>
          </div>
        </div>
      </details>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
