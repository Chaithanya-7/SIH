<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishLens Shield</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Applied before the body renders, so opening the popup never flashes the
       wrong theme. -->
  <script src="theme.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-title">
        <div class="icon-shield">🛡️</div>
        <div>
          <h2>PhishLens</h2>
          <span class="sub" id="connection-state">Connecting…</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-theme" class="icon-btn" type="button"></button>
        <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
      </div>
    </header>

    <!-- Connection problem / setup needed -->
    <div id="setup-notice" class="notice hidden">
      <div id="setup-message">PhishLens backend is not reachable.</div>
      <button id="btn-open-settings" class="btn-secondary full">Open settings</button>
    </div>

    <!-- Compact summary: the popup deliberately shows only headline counts. -->
    <div id="summary" class="hidden">
      <div class="counts">
        <div class="count-row high">
          <span class="count-label">High risk</span>
          <span class="count-value" id="count-high">0</span>
        </div>
        <div class="count-row suspicious">
          <span class="count-label">Suspicious</span>
          <span class="count-value" id="count-suspicious">0</span>
        </div>
        <div class="count-row safe">
          <span class="count-label">Legitimate</span>
          <span class="count-value" id="count-safe">0</span>
        </div>
      </div>

      <div class="meta-row">
        <span>Quarantined <strong id="count-quarantined">0</strong></span>
        <span>Awaiting review <strong id="count-review">0</strong></span>
      </div>

      <div class="mode-note" id="mode-note"></div>

      <div class="recent-section">
        <div class="section-title">Recent detections</div>
        <ul id="recent-list" class="recent-list">
          <li class="empty">No messages analyzed yet.</li>
        </ul>
      </div>
    </div>

    <div class="footer">
      <button id="btn-more-info" class="btn-primary full">More info →</button>
      <button id="btn-web-console" class="link-btn">Desktop app not installed? Open web console</button>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
