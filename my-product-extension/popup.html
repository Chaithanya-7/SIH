<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureMail AI Shield</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-title">
        <div class="icon-shield">🛡️</div>
        <div>
          <h2>SecureMail AI</h2>
          <span class="sub">Threat Protection Shield</span>
        </div>
      </div>
      <div class="status-indicator"></div>
    </header>

    <div class="action-card">
      <button id="btn-scan" class="btn-primary">⚡ Scan Current Email</button>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Analyzing headers & threat intelligence...</span>
    </div>

    <div id="result-card" class="result-card hidden">
      <div class="verdict-header">
        <span id="badge-verdict" class="badge">SAFE</span>
        <span id="risk-score" class="risk-score">0% Risk</span>
      </div>

      <div class="info-row">
        <strong>Sender:</strong> <span id="txt-sender">-</span>
      </div>
      <div class="info-row">
        <strong>Subject:</strong> <span id="txt-subject">-</span>
      </div>

      <!-- Why is this dangerous? Section -->
      <div class="why-section">
        <h4>Why is this dangerous?</h4>
        <ul id="why-list" class="why-list">
          <li>No threat anomalies detected. Email appears safe.</li>
        </ul>
      </div>

      <div class="action-buttons">
        <button id="btn-report" class="btn-secondary">🚨 Report to SOC</button>
        <button id="btn-dashboard" class="btn-secondary">📊 Open SOC Console</button>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
